name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does the committed lockfile install, on every platform anyone develops or builds on?
  #
  # This job exists because the answer has twice been no. `npm install` drops the transitive
  # dependencies of optional packages that the generating machine cannot use, so a lockfile
  # written on an Apple Silicon laptop installs perfectly there and fails on a Linux runner over
  # packages the laptop was never going to see. Nothing on that laptop can detect it, which is
  # what makes it worth a job rather than a rule in a document.
  #
  # `npm ci` alone, no build: the other jobs prove the code works, this one proves the lockfile
  # a fresh clone would resolve is complete.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # `npm test` runs `pretest` first, which compiles the test tree, builds both Vite bundles
      # in order, and runs ESLint - so lint and build are covered here rather than as separate
      # steps. The suite itself downloads the pinned VS Code from `.vscode-test.mjs` and runs in
      # a real extension host, which needs a display; `xvfb-run` supplies one.
      - run: xvfb-run -a npm test

  # Browser-level checks against the real page, served by the demo. Runs in the Playwright
  # image so the browsers and their system libraries are already present and match the pinned
  # dependency exactly - the same image `npm run test:e2e:docker` uses locally, which is what
  # makes a baseline generated in one comparable to a run in the other.
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `@visual` is excluded until Linux pixel baselines are committed. Aria snapshots are text
      # and identical on every platform, so they run here from the first commit; screenshots are
      # not, and a run with no baseline for its platform fails rather than silently passing.
      # Generate them with `npm run test:e2e:docker -- --update-snapshots`, commit
      # `e2e/__screenshots__/linux/`, then drop the grep-invert below.
      - run: npx playwright test --grep-invert @visual

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
